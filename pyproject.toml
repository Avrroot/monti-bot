[project]
name = "savebot"
version = "0.1.0"
description = "Telegram bot that turns links and screenshots into a searchable personal AI library"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "aiogram>=3.13,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3.4,<1.0",
    "redis>=5.0,<6.0",
    "arq>=0.26,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx[socks]>=0.27,<1.0",
    "aiohttp-socks>=0.9,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<6.0",
    "extruct>=0.18,<1.0",
    "aioboto3>=13.1,<14.0",
    "structlog>=24.4,<25.0",
    "tenacity>=9.0,<10.0",
    "openai>=1.51,<2.0",
    "anthropic>=0.36,<1.0",
    "sentry-sdk>=2.14,<3.0",
    "babel>=2.16,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
    "respx>=0.21,<1.0",
    "fakeredis>=2.24,<3.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Postgres+pgvector instance (see tests/integration/conftest.py)",
]
